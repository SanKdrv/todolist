name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskflow
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskflow_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]" "ruff==0.17.5"

      - name: Ruff check
        working-directory: backend
        run: python -m ruff check app tests alembic

      - name: Ruff format check
        working-directory: backend
        run: python -m ruff format --check app tests alembic

      - name: Pytest
        working-directory: backend
        run: pytest -q

  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskflow_migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e "."

      - name: Upgrade to head
        working-directory: backend
        run: alembic -c alembic.ini upgrade head

      - name: Check metadata against migrations
        working-directory: backend
        run: alembic -c alembic.ini check

      - name: Show current revision
        working-directory: backend
        run: alembic -c alembic.ini current

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

  compose:
    name: Production Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet

      - name: Validate init script syntax
        run: bash -n deploy/postgres/init-app-role.sh

  docker:
    name: Production Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --platform linux/amd64 -f backend/Dockerfile.prod -t taskflow-backend:ci ./backend

      - name: Build frontend image
        run: docker build --platform linux/amd64 -f frontend/Dockerfile.prod -t taskflow-frontend:ci ./frontend

      - name: Verify backend runs as non-root
        run: docker run --rm taskflow-backend:ci sh -c 'test "$(id -u)" = "10001"'

      - name: Verify backend imports the application
        run: docker run --rm taskflow-backend:ci python -c "import app.main"

      - name: Verify frontend static files exist
        run: docker run --rm --entrypoint sh taskflow-frontend:ci -c "test -f /srv/index.html"

  e2e:
    name: Selenium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install E2E dependencies
        run: python -m pip install -r e2e/requirements.txt

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.e2e.yml up -d --wait db

      - name: Apply E2E migrations
        run: docker compose -f docker-compose.e2e.yml run --rm backend alembic upgrade head

      - name: Start E2E services
        run: docker compose -f docker-compose.e2e.yml up -d --wait backend web selenium

      - name: Run Selenium E2E
        env:
          E2E_BASE_URL: http://web:8080
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
        run: pytest e2e -v --tb=short

      - name: Collect E2E logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          docker compose -f docker-compose.e2e.yml ps --all > e2e-artifacts/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.e2e.yml logs --no-color --tail=300 db backend web selenium > e2e-artifacts/compose.log 2>&1 || true

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-artifacts
          if-no-files-found: ignore

      - name: Stop E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down

  required:
    name: Required checks
    if: always()
    needs: [backend, migrations, frontend, compose, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
